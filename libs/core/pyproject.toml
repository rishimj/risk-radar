[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskcore"
version = "0.1.0"
description = "Shared domain logic for RiskRadar: entities, risk scoring, adaptive baselines, alert fan-out."
requires-python = ">=3.9"
dependencies = [
    "redis>=5.0",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "kafka-python>=2.0.2",
]
# Note: no feedparser. Its sgmllib3k dependency fails to build on modern
# setuptools, and stdlib xml.etree parses every feed we actually use (verified
# against all five live sources). One less thing to break in a fresh image.

[project.optional-dependencies]
# httpx: fastapi.testclient needs it; collection hard-fails without it.
test = ["pytest>=7.4", "fakeredis>=2.21", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["riskcore*"]
