name: riskradar

# Arch note: every image below builds native on arm64 (M-series) EXCEPT the Flink
# images, which are pinned to linux/amd64 in flink/Dockerfile — PyFlink publishes
# no linux/aarch64 wheel at any version. On x86_64 (t3.xlarge) everything is native.
#
# Two interchangeable stream engines, selected by compose profile. Run exactly
# ONE: both consume news.raw, so running both double-counts every window.
#   --profile flink   flink-jobmanager + flink-taskmanager + flink-submit  (~2.5GB, amd64)
#   --profile lite    processor: the same topology in one Python process  (~100MB, native)
# `make demo` uses flink, `make demo-lite` uses lite. Everything without a
# profile (kafka, redis, postgres, enrichment, ingestion, webapp) runs under both.

x-common-env: &common-env
  KAFKA_BOOTSTRAP: kafka:9092
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-riskradar}:${POSTGRES_PASSWORD:-riskradar}@postgres:5432/${POSTGRES_DB:-riskradar}
  ENRICHMENT_URL: http://enrichment:8082
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Risk/alert/window tuning. These were documented in .env.example but never
  # declared here, so every one of them silently fell back to the hardcoded
  # default in riskcore/config.py — editing .env appeared to do nothing. They
  # are exactly the knobs `make calibrate` exists to tune, so an inert
  # ALERT_PERCENTILE made the whole calibration loop unactionable.
  ALERT_PERCENTILE: ${ALERT_PERCENTILE:-97}
  MIN_MENTIONS_FOR_ALERT: ${MIN_MENTIONS_FOR_ALERT:-2}
  MIN_BASELINE_SAMPLES: ${MIN_BASELINE_SAMPLES:-50}
  ALERT_COOLDOWN_MINUTES: ${ALERT_COOLDOWN_MINUTES:-10}
  WINDOW_SIZE_SECONDS: ${WINDOW_SIZE_SECONDS:-900}
  WINDOW_SLIDE_SECONDS: ${WINDOW_SLIDE_SECONDS:-180}
  WATERMARK_DELAY_SECONDS: ${WATERMARK_DELAY_SECONDS:-30}

services:
  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dual listener: INTERNAL for containers, EXTERNAL so host-side tools
      # (tools/calibrate.py, seed_baseline.py) can reach the broker on localhost:29092.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Default broker heap is 1g. This stack is a single broker carrying two
      # 1-partition topics on a laptop; 512m is ample and leaves room for Flink.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot: create topics explicitly with 1 partition so they show up in Kafka UI
  # before any traffic, and so partition count is deterministic (the Flink job runs
  # parallelism 1 to match).
  # Keep the kafka-topics call on ONE line: compose word-splits `command` itself,
  # and a backslash continuation inside the quoted string does not survive it
  # (it ran `--create` as its own command, so no topic was ever created here).
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      for t in news.raw news.enriched; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
      done
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "
    restart: "no"

  redis:
    image: redis:7-alpine
    # volatile-lru, NOT allkeys-lru: only keys carrying a TTL may be evicted.
    # base:<TICKER> (the alert baselines), feat:<TICKER>:latest (what /api/risk
    # serves) and recent:headlines have no TTL by design, and evicting any of
    # them would silently degrade alerting rather than fail loudly. What stays
    # evictable is seen:news:* (7d dedup, ~85% of all keys), the per-window
    # feat:<TICKER>:<window_end> history, and alert:last_sent:* cooldowns —
    # all of which self-heal. Steady state is roughly 25-50MB, so 256mb is
    # ~5x headroom rather than a limit we expect to reach.
    command: ["redis-server", "--appendonly", "yes",
              "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Users, watchlists, alert history and deliveries (schema: libs/core/riskcore/db.py,
  # created idempotently by whichever service starts first). Published on
  # loopback only, for psql and the test suite.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riskradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskradar}
      POSTGRES_DB: ${POSTGRES_DB:-riskradar}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskradar} -d ${POSTGRES_DB:-riskradar}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Browsing-only convenience; nothing in the pipeline depends on it. Assigned to
  # the "tools" profile so it stays OFF by default — on a 16GB laptop this is the
  # cheapest ~400MB to not spend. Start it explicitly when you want it:
  #   docker compose --profile tools up -d kafka-ui
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    depends_on:
      kafka: {condition: service_healthy}
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: riskradar
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Xmx256m"
    restart: unless-stopped

  enrichment:
    build:
      context: .
      dockerfile: services/enrichment/Dockerfile
    ports:
      - "8082:8082"
    environment:
      <<: *common-env
      SENTIMENT_MODEL: ${SENTIMENT_MODEL:-ProsusAI/finbert}
      HF_HOME: /models
    volumes:
      - model-cache:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8082/healthz')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s   # first boot downloads FinBERT (~440MB)
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    depends_on:
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      <<: *common-env
      FETCH_INTERVAL_SECONDS: ${FETCH_INTERVAL_SECONDS:-120}
      MAX_ARTICLE_AGE_HOURS: ${MAX_ARTICLE_AGE_HOURS:-6}
      ENABLE_GNEWS: ${ENABLE_GNEWS:-true}
      ENABLE_SEC: ${ENABLE_SEC:-false}
      SEC_CONTACT_EMAIL: ${SEC_CONTACT_EMAIL:-}
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: services/webapp/Dockerfile
    depends_on:
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    ports:
      - "3000:3000"
    environment:
      <<: *common-env
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FLINK_URL: http://flink-jobmanager:8081
      PROCESSOR_URL: http://processor:8083
    restart: unless-stopped

  # Populates each ticker's baseline from the last 24h of real news so the first
  # hours after `make demo` aren't a cold-start alert storm. Reuses the webapp
  # image because it already carries riskcore plus the tools/ directory.
  seed-baseline:
    build:
      context: .
      dockerfile: services/webapp/Dockerfile
    depends_on:
      redis: {condition: service_healthy}
    environment:
      <<: *common-env
    command: ["python", "/app/tools/seed_baseline.py"]
    restart: "no"

  flink-jobmanager:
    profiles: ["flink"]
    build:
      context: .
      dockerfile: flink/Dockerfile
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      <<: *common-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        parallelism.default: 1
        jobmanager.memory.process.size: 1024m
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  flink-taskmanager:
    profiles: ["flink"]
    build:
      context: .
      dockerfile: flink/Dockerfile
    depends_on:
      flink-jobmanager: {condition: service_healthy}
    command: taskmanager
    environment:
      <<: *common-env
      # Slots were 4 while parallelism.default is 1, so three sat idle. Slots do
      # not multiply process memory, but they do carve up managed memory and
      # network buffers, which starves the one slot actually doing work.
      #
      # process.size caps the WHOLE container (heap + managed + network + JVM
      # overhead), which matters here because PyFlink forks a Beam Python worker
      # per slot on top of the JVM. Default is 1728m; 1400m plus the Python
      # process still fits comfortably.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        taskmanager.memory.process.size: 1400m
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
    restart: unless-stopped

  # One-shot real cluster submission via the Flink CLI. The old repo's submit_job.py
  # ran an embedded mini-cluster instead, which is why its 8081 UI was always empty.
  flink-submit:
    profiles: ["flink"]
    build:
      context: .
      dockerfile: flink/Dockerfile
    depends_on:
      flink-jobmanager: {condition: service_healthy}
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      enrichment: {condition: service_healthy}
    environment:
      <<: *common-env
    command: >
      flink run -d -m flink-jobmanager:8081
      -py /opt/riskradar/job/news_job.py
      -pyexec python3 -pyclientexec python3
    restart: "no"

  # The lite engine: flink/job/news_job.py's topology as one Python process.
  # Shares every outcome-deciding line with the Flink job via riskcore.stages;
  # see services/processor/src/engine.py for how Flink's event-time rules are
  # mirrored. Trade-off: window state is in memory, not checkpointed.
  processor:
    profiles: ["lite"]
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    depends_on:
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      enrichment: {condition: service_healthy}
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8083/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  kafka-data:
  redis-data:
  postgres-data:
  model-cache:
  flink-checkpoints:
