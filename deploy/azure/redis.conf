# RiskRadar's private Redis. No TCP listener: only the riskradar user can reach
# the socket (directory 0750 + socket 0700).
port 0
unixsocket /srv/risk-radar/run/redis.sock
unixsocketperm 700
protected-mode yes
dir /srv/risk-radar/redis
daemonize no
supervised no
loglevel notice
logfile ""
# Same policy as docker-compose.yml: only keys with a TTL are evictable, so
# baselines and features are never silently dropped.
maxmemory 64mb
maxmemory-policy volatile-lru
appendonly yes
appendfsync everysec
save 900 1
# Nothing on this host needs these; disable them outright.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
