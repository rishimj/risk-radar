<label for="slack-url">Incoming webhook URL</label>
<input id="slack-url" type="url" maxlength="300" placeholder="https://hooks.slack.com/services/T…/B…/…"
       value="{{ user.slack_webhook_url or '' }}">
<div class="form-actions">
  <button id="save-slack" class="ghost">Save</button>
  <button id="test-slack">Send test message</button>
  <span id="slack-msg" class="note" role="status"></span>
</div>
<p class="note" style="margin-top:10px">Alerts are delivered only after a successful test. Simulated alerts are never sent to Slack.</p>
