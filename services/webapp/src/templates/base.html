<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RiskRadar{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📡</text></svg>">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">Risk<span>Radar</span></a>
    <nav class="links">
      {% if user %}
        <a href="/dashboard">Dashboard</a>
        <a href="/settings">Settings</a>
        <a href="/logout">Sign out</a>
      {% else %}
        <a href="/login">Sign in</a>
        <a class="btn" href="/signup">Get started</a>
      {% endif %}
    </nav>
  </div>
</header>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="wrap">
  Kafka · PyFlink · FinBERT · Redis · DynamoDB —
  alerting is relative to each ticker's own 24h baseline, not a fixed threshold.
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
